spring.application.name=trivia-sesgos

# --- SQLite ---------------------------------------------------------------
# WAL va en la URL: xerial parsea los query params como PRAGMAs.
spring.datasource.url=jdbc:sqlite:data/trivia.db?journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- JPA / Hibernate ------------------------------------------------------
# El dialecto vive en hibernate-community-dialects, no en el core.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Serial (Arduino) -----------------------------------------------------
trivia.serial.port=COM4
trivia.serial.baud=9600
